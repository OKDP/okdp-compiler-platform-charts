# OKDP's defaults of the Apache Superset chart (okdp.yaml defaults), over the
# chart's values.yaml and under the values values.cel.yaml computes. Plain
# YAML, not a template. OKDP's settings are here and in the environment of
# the pods (extraEnv, values.cel.yaml).
image:
  repository: quay.io/okdp/superset
  tag: 6.0.0
  pullPolicy: IfNotPresent
supersetWebsockets:
  image:
    repository: quay.io/okdp/superset
    tag: 6.0.0-websocket
    pullPolicy: IfNotPresent

# The chart's own env Secret <release>-env, loaded by every pod
# (envFromSecret): the database and cache settings (database, cache; the
# host and name of the metadata database in values.cel.yaml). Its DB_USER
# and DB_PASS are the chart's placeholders, never read: the credentials come
# from the connection's Secret (extraEnvRaw), which wins over the Secret.
secretEnv:
  create: true

# Appended to superset_config.py, sorted by key (the upstream chart passes each
# block to tpl). Computed blocks (values.cel.yaml): oauth_to_superset_roles_mapping,
# extra_config.
configOverrides:
  auth_registration: |
    AUTH_USER_REGISTRATION = True
    AUTH_ROLE_PUBLIC = "Public"
    AUTH_USER_REGISTRATION_ROLE = "Public"
    AUTH_ROLES_SYNC_AT_LOGIN = True
  feature_flags: |
    # https://github.com/apache/superset/blob/master/RESOURCES/FEATURE_FLAGS.md
    FEATURE_FLAGS = {
      "DASHBOARD_RBAC": True,
      "EMBEDDED_SUPERSET": True,
      "EMBEDDABLE_CHARTS": True,
      "ENABLE_TEMPLATE_PROCESSING": True,
      "DASHBOARD_NATIVE_FILTERS": True,
      "DASHBOARD_CROSS_FILTERS": True,
    }
  # Session cookie expiry (FLASK_APP_MUTATOR).
  session_config: |
    # https://superset.apache.org/docs/configuration/configuring-superset/

    from flask import session
    from flask import Flask

    def make_session_permanent():
        '''
        Enable maxAge for the cookie 'session'
        '''
        session.permanent = True

    def FLASK_APP_MUTATOR(app: Flask) -> None:
        app.before_request_funcs.setdefault(None, []).append(make_session_permanent)
  # OAuth2 sign-in: the keycloak (and dex) providers, read from the environment (extraEnv) and the client credentials (extraEnvRaw).
  oauth_enabled: |
    import os

    AUTH_OAUTH_ENABLED = os.environ["AUTH_OAUTH_ENABLED"] == "true"
    if AUTH_OAUTH_ENABLED:
      from flask_appbuilder.security.manager import AUTH_OAUTH

      oauth2_providers = [
          {   'name':'dex',
              'token_key':'access_token',
              'icon':'fa-address-card',
              'remote_app': {
                  'client_id': os.environ["AUTH_OAUTH_CLIENT_ID"],
                  'client_secret': os.environ["AUTH_OAUTH_CLIENT_SECRET"],
                  'client_kwargs':{
                      'scope': os.environ["AUTH_OAUTH_SCOPE"],
                      'verify': os.environ["AUTH_OAUTH_SSL_CERTIFICATE_VERIFY"] == "true",
                      'code_challenge_method': os.environ["AUTH_OAUTH_USE_PKCE"]
                  },
                  'api_base_url': '%s/' % os.environ["AUTH_OAUTH_BASE_URL"],
                  'access_token_url': '%s/token' % os.environ["AUTH_OAUTH_BASE_URL"],
                  'authorize_url': '%s/auth' % os.environ["AUTH_OAUTH_BASE_URL"],
                  'jwks_uri': '%s/keys' % os.environ["AUTH_OAUTH_BASE_URL"],
                  'redirect_uri': 'https://%s/oauth-authorized/dex' % os.environ["SUPERSET_DOMAIN"],
              }
          },
          {   'name':'keycloak',
              'token_key':'access_token',
              'icon':'fa-key',
              'remote_app': {
                  'client_id': os.environ["AUTH_OAUTH_CLIENT_ID"],
                  'client_secret': os.environ["AUTH_OAUTH_CLIENT_SECRET"],
                  'client_kwargs':{
                      'scope': os.environ["AUTH_OAUTH_SCOPE"],
                      'verify': os.environ["AUTH_OAUTH_SSL_CERTIFICATE_VERIFY"] == "true",
                      'code_challenge_method': os.environ["AUTH_OAUTH_USE_PKCE"]
                  },
                  'api_base_url': '%s/' % os.environ["AUTH_OAUTH_BASE_URL"],
                  'access_token_url': '%s/token' % os.environ["AUTH_OAUTH_BASE_URL"],
                  'authorize_url': '%s/auth' % os.environ["AUTH_OAUTH_BASE_URL"],
                  'jwks_uri': '%s/certs' % os.environ["AUTH_OAUTH_BASE_URL"],
                  'redirect_uri': 'https://%s/oauth-authorized/keycloak' % os.environ["SUPERSET_DOMAIN"],
              }
          }
      ]
      AUTH_OAUTH_PROVIDER = os.environ["AUTH_OAUTH_PROVIDER"]
      OAUTH_PROVIDERS = list(filter(lambda e: e['name'] == AUTH_OAUTH_PROVIDER, oauth2_providers))
      AUTH_TYPE = AUTH_OAUTH
  # OAuth2 of the Trino datasources (the environment, extraEnv).
  trino_oauth_enabled: |
    import os

    TRINO_OAUTH_ENABLED = os.environ["TRINO_OAUTH_ENABLED"] == "true"
    if TRINO_OAUTH_ENABLED:
      superset_domain = os.environ["SUPERSET_DOMAIN"].strip().strip("/")
      redirect_uri = f"https://{superset_domain}/api/v1/database/oauth2/"

      DATABASE_OAUTH2_REDIRECT_URI = redirect_uri
      DATABASE_OAUTH2_CLIENTS = {
        "Trino": {
            "id": os.environ["TRINO_OAUTH_CLIENT_ID"],
            "secret": os.environ["TRINO_OAUTH_CLIENT_SECRET"],
            "scope": os.getenv("TRINO_OAUTH_SCOPE", "openid profile email groups"),
            "authorization_request_uri": f'{os.environ["TRINO_AUTH_OAUTH_BASE_URL"].rstrip("/")}/auth',
            "token_request_uri": f'{os.environ["TRINO_AUTH_OAUTH_BASE_URL"].rstrip("/")}/token',
        }
      }
  # User info and role keys of the keycloak and dex providers.
  custom_sso_security_manager: |
    # https://superset.apache.org/docs/configuration/configuring-superset/#custom-oauth2-configuration
    import logging as log
    import os
    from superset.security import SupersetSecurityManager

    class CustomSsoSecurityManager(SupersetSecurityManager):

        def oauth_user_info(self, provider, response=None):
            info = self._oauth_user_info(provider, response)
            allowed = [g for g in os.environ.get("AUTH_OAUTH_ALLOWED_GROUPS", "").split(",") if g]
            if not set(allowed) & set(info.get("groups", [])):
                log.warning("Oauth2 sign-in refused: %s is in no allowed group", info.get("username", ""))
                return {}
            return info

        def _oauth_user_info(self, provider, response=None):
            log.info("Oauth2 provider: {0}.".format(provider))
            if provider == 'dex':
                # As example, this line request a GET to base_url + '/' + userDetails with Bearer  Authentication,
                # and expects that authorization server checks the token, and response with user details
                me = self.appbuilder.sm.oauth_remotes[provider].get('userinfo').json()
                log.info("Received userinfo {0} from oidc provider {1}".format(me, provider))
                userinfo = {
                      'username': me.get('preferred_username', me.get('email', me.get('name', ''))),
                      'first_name': me.get('given_name', ''),
                      'last_name': me.get('family_name', ''),
                      'name': me.get('name', ''),
                      'email': me.get('email', ''),
                      'sub': me.get('sub', ''),
                      'groups': me.get('groups', []),
                      'role_keys': me.get('groups', []),
                }
                log.info("Effective role mapping: {0}".format(userinfo))
                return userinfo
            elif provider == 'keycloak':
                # As example, this line request a GET to base_url + '/' + userDetails with Bearer  Authentication,
                # and expects that authorization server checks the token, and response with user details
                me = self.appbuilder.sm.oauth_remotes[provider].get('userinfo').json()
                log.info("Received userinfo {0} from oidc provider {1}".format(me, provider))
                userinfo = {
                    'username' : me.get('preferred_username', ''),
                    'first_name': me.get('given_name', ''),
                    'last_name': me.get('family_name', ''),
                    'name': me.get('name', ''),
                    'email' : me.get('email', ''),
                    'sub' : me.get('sub', ''),
                    'groups': me.get('groups', []),
                    'role_keys': me.get('roles', []) + me.get('groups', [])
                }
                log.info("Effective role mapping: {0}".format(userinfo))
                return userinfo
            else:
                return {}

    CUSTOM_SECURITY_MANAGER = CustomSsoSecurityManager
  # Examples database (SQLALCHEMY_EXAMPLES_URI of the environment, extraEnv).
  load_examples: |
    import os
    sqlalchemy_examples_uri = os.path.expandvars(os.getenv('SQLALCHEMY_EXAMPLES_URI', ''))
    if sqlalchemy_examples_uri:
      SQLALCHEMY_EXAMPLES_URI = sqlalchemy_examples_uri
  # The guest tokens of embedded dashboards (EMBEDDED_SUPERSET) are signed
  # with a generated key, not Superset's default (extraEnvRaw).
  guest_token: |
    import os
    GUEST_TOKEN_JWT_SECRET = os.environ["GUEST_TOKEN_JWT_SECRET"]
  # The Valkey password of the async queries backends: the Apache chart writes
  # the value of cache.password there, the password is only in the environment.
  valkey_password: |
    GLOBAL_ASYNC_QUERIES_CACHE_BACKEND["CACHE_REDIS_PASSWORD"] = env("REDIS_PASSWORD", "")
    GLOBAL_ASYNC_QUERIES_RESULTS_BACKEND["password"] = env("REDIS_PASSWORD", "")

# The cache and Celery broker, the Valkey of okdp.yaml (objects; cache.host is computed).
# Its password is read from REDIS_PASSWORD at runtime (never a value): the URLs
# are built from the environment; RESULTS_BACKEND is given as code, and
# configOverrides.valkey_password completes the async queries backends.
cache:
  port: 6379
  cacheDb: 1
  celeryDb: 0
  defaultTimeout: 300
config:
  resultsBackend: "RedisCache(host=env('REDIS_HOST'), password=env('REDIS_PASSWORD'), port=int(env('REDIS_PORT', '6379')), key_prefix='superset_results')"

# The chart's bundled bitnami subcharts, rendered as published: both off
# (protected in okdp.yaml).
postgresql:
  # An external database (metadataDb).
  enabled: false
redis:
  # The Valkey of okdp.yaml (objects) replaces the bundled bitnami redis,
  # which reads its previous password with lookup.
  enabled: false

init:
  # The local admin (no OIDC) is created by init.command (values.cel.yaml).
  createAdmin: false
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

# Not root: configOverrides is Python an instance adds to. The image runs as
# superset (uid 1000); runAsUser is the chart's own key for every pod.
runAsUser: 1000

# forceReload stamps the pods with randAlphaNum, a new value at each render:
# never set (protected in okdp.yaml). The pods' security: non-root, the
# capabilities dropped, no privilege escalation, seccomp.
supersetNode:
  forceReload: false
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
supersetWorker:
  forceReload: false
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
supersetCeleryBeat:
  forceReload: false
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
supersetMcp:
  forceReload: false
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
supersetCeleryFlower:
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
supersetWebsockets:
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

ingress:
  enabled: true
  annotations:
    acme.cert-manager.io/http01-edit-in-place: "true"
    ## Extend timeout to allow long running queries.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
  path: /
  pathType: ImplementationSpecific
