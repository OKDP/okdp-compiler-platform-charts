# The platform values of the case no-oidc-proxy, over platform.yaml (level 0):
# OIDC off, a forward proxy, another suffix and issuer, no CA bundle ("").
global:
  okdp:
    ingress:
      suffix: okdp.example.com
    oidc:
      enabled: false
      issuerUri: https://idp.example.com/realms/data
    proxy:
      httpProxy: http://proxy:3128
      httpsProxy: http://proxy:3128
      noProxy: .svc
    tls:
      clusterIssuer: platform-issuer
      caBundleSecret: ""
