# One hive catalog on an internal metastore, the hive-metastore instance
# hive of the project (internal-hive-instances/), whose hive output it
# references by its name, and the bucket lake, a named claim of the project
# (internal-hive-project.yaml) the metastore claims too: the catalog's S3
# identity is the claim's credentials Secret. OPA off, as in the demo
# project.
hiveCatalogs:
  - name: bronze
    metastore: hive
    storage: lake
enableOPA: false
