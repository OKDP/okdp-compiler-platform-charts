# The values of the airflow chart, computed
# from the parameters, the platform values and the connections; they see the
# vars of okdp.yaml.
airflow:
  extraEnv: "${{ (oidcEnabled ? oidcEnv : '') + (dbConnection ? dbEnv : '') + commonEnv + (caBundle != '' ? caEnv : '') }}"
  # The platform's CA bundle (global.okdp.tls.caBundleSecret), when set, the
  # one the caEnv variables point at, mounted in every Airflow container: a
  # component without it fails any HTTPS call to a certificate of the
  # platform's CA, and the CLI itself talks to the API server over HTTPS.
  volumes:
    - $if: ${{ caBundle != '' }}
      name: cacerts
      secret:
        secretName: ${{ caBundle }}
  volumeMounts:
    - $if: ${{ caBundle != '' }}
      name: cacerts
      mountPath: /cacerts
  # The connection string built from the db connection (extraEnv): the
  # chart's own variables off.
  enableBuiltInSecretEnvVars:
    $if: ${{ dbConnection }}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: false
    AIRFLOW_CONN_AIRFLOW_DB: false
  apiServer:
    annotations: ${{ workloadAnnotations }}
    resources:
      limits:
        memory: ${{ str(values.webserverMemoryGi) }}Gi
    apiServerConfig:
      $if: ${{ oidcEnabled }}
      $value: |
        import logging
        import os

        from airflow.providers.fab.auth_manager.security_manager.override import FabAirflowSecurityManagerOverride
        from flask_appbuilder.security.manager import AUTH_OAUTH

        verify_tls = os.environ.get("INSECURE_VERIFY_TLS", "true").lower() == "true"
        oauth_verify = os.environ.get("REQUESTS_CA_BUNDLE") if verify_tls else False

        AUTH_TYPE = AUTH_OAUTH
        AUTH_USER_REGISTRATION = True
        # What a user gets beside the roles of its groups: nothing. The realm's
        # people are not the project's: only the members of the groups below
        # register (OkdpSecurityManager).
        AUTH_USER_REGISTRATION_ROLE = "Public"
        # Sync Airflow roles from OIDC groups at every login
        AUTH_ROLES_SYNC_AT_LOGIN = True
        # Map OIDC groups to Airflow roles: the project's groups and the
        # platform's administrators by default (okdp.yaml, roleGroups)
        AUTH_ROLES_MAPPING = {${{ roleMapping.map(l, '\n    ' + l).join('') }}
        }


        class OkdpSecurityManager(FabAirflowSecurityManagerOverride):
            """Signs in, and registers, the members of a group of AUTH_ROLES_MAPPING only."""

            def auth_user_oauth(self, userinfo, *args, **kwargs):
                allowed = {group for group, roles in AUTH_ROLES_MAPPING.items() if roles}
                if not allowed.intersection(userinfo.get("role_keys") or []):
                    logging.getLogger(__name__).warning(
                        "sign-in of %r refused: none of its groups has an Airflow role", userinfo.get("username")
                    )
                    return None
                return super().auth_user_oauth(userinfo, *args, **kwargs)


        SECURITY_MANAGER_CLASS = OkdpSecurityManager

        OAUTH_PROVIDERS = [
            {
                "name": "oidc",
                "icon": "fa-circle-o",
                "token_key": "access_token",
                "remote_app": {
                    "client_id": os.environ["AIRFLOW_OIDC_CLIENT_ID"],
                    "client_secret": os.environ["AIRFLOW_OIDC_CLIENT_SECRET"],
                    "api_base_url": os.environ["AIRFLOW_OIDC_API_BASE_URL"],
                    "access_token_url": os.environ["AIRFLOW_OIDC_ACCESS_TOKEN_URL"],
                    "authorize_url": os.environ["AIRFLOW_OIDC_AUTHORIZE_URL"],
                    "server_metadata_url": os.environ["AIRFLOW_OIDC_SERVER_METADATA_URL"],
                    "client_kwargs": {
                        "scope": os.environ.get("AIRFLOW_OIDC_SCOPE", "openid profile email").replace("+", " "),
                        "verify": oauth_verify,
                    },
                },
            },
        ]
  scheduler:
    annotations: ${{ workloadAnnotations }}
    resources:
      limits:
        memory: ${{ str(values.schedulerMemoryGi) }}Gi
  triggerer:
    annotations: ${{ workloadAnnotations }}
  ingress:
    apiServer:
      ingressClassName: ${{ global.okdp.ingress.className }}
      annotations: ${{ platform.ingressAnnotations }}
      hosts:
        - name: ${{ host }}
          tls:
            enabled: true
            secretName: ${{ release.name }}-airflow-tls
  # The pre-provisioned Secret holding the full SQLAlchemy connection
  # string, else the db connection's credentials Secret (its variables off):
  # the chart does not generate its own airflow-metadata secret, so
  # credentials never appear in the values.
  data:
    metadataSecretName: ${{ first([values.metadataSecret, db.?secretRef.name.orValue('')]) }}
  dags:
    gitSync:
      $for: e in gitSync
      $key: ${{ e.k }}
      $value: ${{ e.v }}
  dagProcessor:
    annotations: ${{ workloadAnnotations }}
    resources:
      limits:
        memory: ${{ str(values.dagProcessorMemoryGi) }}Gi
        cpu: ${{ str(values.dagProcessorCpuCores) }}
  # Generated once by ESO (okdp.yaml objects): the chart's own templates would mint
  # them with randAlphaNum on every render.
  fernetKeySecretName: ${{ internalSecret }}
  apiSecretKeySecretName: ${{ internalSecret }}
  jwtSecretName: ${{ internalSecret }}
  # app.kubernetes.io/instance on every object and pod template, which the
  # chart leaves out (the console finds the pods by it): the chart's common
  # labels, never used in its selectors.
  labels:
    app.kubernetes.io/instance: ${{ release.name }}
