# The platform values of the case oidc-endpoints: OIDC on, the issuer only
# (level 0).
global:
  okdp:
    ingress:
      suffix: example.org
      className: nginx
    tls:
      clusterIssuer: letsencrypt
      caBundleSecret: certs-bundle
    oidc:
      issuerUri: https://sso.example.org/realms/data
