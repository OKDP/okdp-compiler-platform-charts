# The connections of the case oidc-endpoints: the instance's own (connections.yaml, level 2).
connections:
  pg:
    contract: database-server
    engine: postgresql
    host: pg.example.org
    port: 5432
    dbName: airflow
    secretRef:
      name: airflow-pg
  minio:
    contract: s3
    apiUrl: https://minio.example.org
    region: us-east-1
    pathStyle: true
