# The connections of the case mysql: the instance's own (connections.yaml, level 2).
connections:
  mysql:
    contract: database-server
    engine: mysql
    host: mysql.example.org
    port: 3306
    dbName: airflow
    secretRef:
      name: airflow-mysql
  minio:
    contract: s3
    apiUrl: https://minio.example.org
    region: us-east-1
    pathStyle: true
