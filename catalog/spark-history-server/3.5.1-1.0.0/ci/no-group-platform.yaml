# The platform values of the case no-group: no administrators, over platform.yaml (level 0).
global:
  okdp:
    ingress:
      suffix: okdp.sandbox
      className: nginx
    tls:
      clusterIssuer: default-issuer
      caBundleSecret: certs-bundle
    oidc:
      enabled: true
      issuerUri: https://keycloak.okdp.sandbox/realms/master
      scope: openid profile email groups
      usePKCE: true
    access:
      admins: []
