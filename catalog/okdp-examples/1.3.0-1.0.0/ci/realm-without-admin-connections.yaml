# The connections of the case realm-without-admin: the instance's own (connections.yaml, level 2).
connections:
  demo-storage:
    contract: s3
    apiUrl: https://storage-default-api.okdp.sandbox
    internalUrl: http://storage-s3.default.svc.cluster.local:8333
    region: us-east-1
    pathStyle: true
  shared-trino:
    contract: trino
    url: https://trino.example.org
    uri: trino://trino@trino.example.org:443
  shared-polaris:
    contract: iceberg-catalog
    uri: https://polaris.example.org/api/catalog
